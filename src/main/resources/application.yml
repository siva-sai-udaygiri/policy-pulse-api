spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/policypulse
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.springframework.boot.context.config: DEBUG

aws:
  region: us-east-1
  s3:
    bucket-name: policy-pulse-documents-sivasai-2026

kafka:
  bootstrap-servers: localhost:9092
  topic:
    document-uploaded: policy-document-uploaded